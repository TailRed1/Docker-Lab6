# Конфігурація вебсервера web.
# Документація: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
#               https://nginx.org/en/docs/http/configuring_https_servers.html

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docker-compose.loc;

    # Сертифікат і ключ створює сервіс certboot у спільному томі.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Статичні файли, зібрані сервісом frontend-build.
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Flask-застосунок відповідає на /articles і слухає порт 5000.
    location /api/articles {
        proxy_pass http://python-app:5000/articles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PHP-застосунок відповідає в корені й слухає порт 80.
    location /api/users {
        proxy_pass http://php-app:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Запити HTTP перенаправляються на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name docker-compose.loc;
    return 301 https://$host$request_uri;
}
