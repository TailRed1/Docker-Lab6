name: lab6

services:
  certboot:
    image: alpine/openssl:3.5.9
    environment:
      CERT_GEN_COMMAND: ${CERT_GEN_COMMAND}
    entrypoint: ["/bin/sh", "-c"]
    command: ["$$CERT_GEN_COMMAND"]
    volumes:
      - certs:/certs

  frontend-build:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-dist:/app/dist
    environment:
      VITE_ARTICLES_URL: ${VITE_ARTICLES_URL}
      VITE_USERS_URL: ${VITE_USERS_URL}
    command: ["npm", "run", "build:all"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./php_app/init:/docker-entrypoint-initdb.d:ro
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  python-app:
    build:
      context: ./python_app
    networks:
      - front

  php-app:
    image: webdevops/php-apache:8.4
    environment:
      WEB_DOCUMENT_ROOT: /app
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
    volumes:
      - ./php_app:/app:ro
    networks:
      - front
      - back
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - certs:/etc/nginx/certs:ro
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - front
    depends_on:
      certboot:
        condition: service_completed_successfully
      frontend-build:
        condition: service_completed_successfully
      python-app:
        condition: service_started
      php-app:
        condition: service_started

configs:
  nginx-config:
    file: ./nginx/nginx.conf

networks:
  front:
    driver: bridge
  back:
    driver: bridge

volumes:
  certs:
  frontend-node-modules:
  frontend-dist:
  db-data: